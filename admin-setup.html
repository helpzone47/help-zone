<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help Zone | Admin Setup</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">HELP <span>ZONE</span></a></header><main class="wrap"><section class="panel"><h2>প্রথম অ্যাডমিন পাসওয়ার্ড তৈরি</h2><p class="muted">এই একবারের সেটআপের জন্য সার্ভারের .env ফাইলে রাখা setup key প্রয়োজন। সেটআপ শেষ হলে এই পেজটি মুছে দিন বা বন্ধ করে দিন।</p><form id="setupForm"><label>One-time setup key<input name="setupKey" required></label><label>নতুন পাসওয়ার্ড (কমপক্ষে ১২ অক্ষর)<input type="password" name="password" minlength="12" required></label><button>অ্যাডমিন পাসওয়ার্ড তৈরি করুন</button><p id="setupNotice" class="notice" role="status"></p></form></section></main><script src="/setup.js"></script></body></html>

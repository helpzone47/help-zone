
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b57">
  <meta name="description" content="Help Zone Premium Admin Panel">
  <title>Help Zone | Admin Dashboard</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right,#e1edff,transparent 40%),
        #f4f7fc;
    }

    .admin {
      width: min(850px,92%);
      margin: 55px auto;
    }

    .adminHero {
      text-align: center;
      margin-bottom: 28px;
    }

    .adminHero .pill {
      background: #e6efff;
      color: #174ea6;
      border: 1px solid #d2e2ff;
    }

    .adminHero h1 {
      color: #102b57;
      font-size: 32px;
      margin: 15px 0 5px;
    }

    .adminHero p {
      color: #71819c;
      line-height: 1.9;
    }

    .adminPanel {
      padding: 32px;
      border: 1px solid #e3eaf5;
      border-radius: 24px;
      background: white;
      box-shadow: 0 20px 60px rgba(15,35,75,.10);
    }

    .loginIcon {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 20px;
      color: white;
      font-size: 28px;
      background: linear-gradient(135deg,#173b78,#3188ee);
      box-shadow: 0 10px 25px #2563eb35;
    }

    .adminPanel h2 {
      color: #102b57;
    }

    .adminPanel label {
      display: block;
      margin-top: 20px;
      color: #233a60;
      font-size: 13px;
      font-weight: 800;
    }

    .adminPanel input,
    .adminPanel textarea {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #dce5f2;
      border-radius: 13px;
      background: #f8faff;
      outline: none;
      font: inherit;
    }

    .adminPanel input:focus,
    .adminPanel textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px #2563eb18;
    }

    .adminPanel button {
      cursor: pointer;
    }

    .adminPanel .secondary {
      width: auto;
      margin: 0;
      padding: 11px 17px;
      color: #245a9c;
      background: #e9f1fc;
      box-shadow: none;
    }

    .inboxHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .inboxHead .headActions {
      display: flex;
      gap: 9px;
    }

    .message {
      margin-top: 17px;
      padding: 21px;
      border: 1px solid #e3eaf5;
      border-radius: 18px;
      background: #fbfcff;
      box-shadow: 0 5px 18px rgba(16,43,87,.05);
    }

    .message h3 {
      margin: 0 0 10px;
      color: #102b57;
    }

    .message p {
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .messageText {
      padding: 13px;
      border-radius: 12px;
      background: white;
      white-space: pre-wrap;
    }

    .message .reply textarea {
      min-height: 95px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions button {
      width: auto;
      flex: 1;
      margin-top: 12px;
    }

    .actions .delete {
      color: #b42318;
      background: #fff0f0;
      box-shadow: none;
    }

    .adminFooter {
      text-align: center;
      color: #8190a7;
      font-size: 13px;
      padding: 25px 10px;
    }

    .hidden {
      display: none !important;
    }

    @media(max-width:600px) {
      .admin {
        margin: 35px auto;
      }

      .adminHero h1 {
        font-size: 27px;
      }

      .adminPanel {
        padding: 23px 18px;
      }

      .inboxHead {
        align-items: flex-start;
        flex-direction: column;
      }

      .inboxHead .headActions {
        width: 100%;
      }

      .inboxHead .headActions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="/">
    <span class="brand-icon">H</span>
    <span>HELP <strong>ZONE</strong></span>
  </a>

  <div class="header-actions">
    <button id="languageBtn" class="language-btn" type="button">English</button>
  </div>
</header>

<main class="admin">

  <div class="adminHero">
    <div class="pill">HELP ZONE · ADMINISTRATION</div>

    <h1>Admin Dashboard</h1>

    <p data-bn="আপনার কাস্টমার সাপোর্ট পরিচালনা করুন"
       data-en="Manage your customer support">
      আপনার কাস্টমার সাপোর্ট পরিচালনা করুন
    </p>
  </div>

  <section class="adminPanel" id="loginPanel">

    <div class="loginIcon">🔐</div>

    <h2 style="text-align:center"
        data-bn="অ্যাডমিন লগইন"
        data-en="Admin Login">
      অ্যাডমিন লগইন
    </h2>

    <p class="admin-muted" style="text-align:center"
       data-bn="আপনার অ্যাডমিন পাসওয়ার্ড দিয়ে প্রবেশ করুন।"
       data-en="Sign in using your administrator password.">
      আপনার অ্যাডমিন পাসওয়ার্ড দিয়ে প্রবেশ করুন।
    </p>

    <form id="loginForm">
      <label>
        <span data-bn="পাসওয়ার্ড" data-en="Password">পাসওয়ার্ড</span>
        <input type="password"
               name="password"
               required
               autocomplete="current-password"
               placeholder="Admin Password">
      </label>

      <button type="submit" class="submit-btn"
              data-bn="লগইন করুন"
              data-en="Sign In">
        লগইন করুন
      </button>

      <p id="loginNotice" class="notice" role="status"></p>
    </form>

  </section>

  <section class="adminPanel hidden" id="inboxPanel">

    <div class="inboxHead">
      <div>
        <div class="pill">CUSTOMER SUPPORT</div>

        <h2 data-bn="মেসেজ ইনবক্স"
            data-en="Message Inbox">
          মেসেজ ইনবক্স
        </h2>

        <p class="admin-muted"
           data-bn="কাস্টমারদের পাঠানো বার্তা"
           data-en="Messages sent by customers">
          কাস্টমারদের পাঠানো বার্তা
        </p>
      </div>

      <div class="headActions">
        <button class="secondary" id="refreshBtn"
                type="button"
                data-bn="রিফ্রেশ"
                data-en="Refresh">
          রিফ্রেশ
        </button>

        <button class="secondary" id="logoutBtn"
                type="button"
                data-bn="লগআউট"
                data-en="Logout">
          লগআউট
        </button>
      </div>
    </div>

    <div id="messages">
      <p class="admin-muted">মেসেজ লোড হচ্ছে...</p>
    </div>

  </section>

</main>

<footer class="adminFooter">
  © 2026 Help Zone ·
  <span data-bn="নিরাপদ অ্যাডমিন প্যানেল"
        data-en="Secure Admin Panel">
    নিরাপদ অ্যাডমিন প্যানেল
  </span>
</footer>

<script src="/admin.js"></script>

<script>
(() => {
  const languageBtn = document.getElementById("languageBtn");
  let currentLanguage =
    localStorage.getItem("helpzone-admin-language") || "bn";

  function setLanguage(language) {
    currentLanguage = language;
    document.documentElement.lang = language;

    localStorage.setItem("helpzone-admin-language", language);

    document.querySelectorAll("[data-bn][data-en]").forEach(element => {
      element.innerHTML = element.dataset[language];
    });

    languageBtn.textContent =
      language === "bn" ? "English" : "বাংলা";
  }

  languageBtn.addEventListener("click", () => {
    setLanguage(currentLanguage === "bn" ? "en" : "bn");
  });

  setLanguage(currentLanguage);

  document.getElementById("refreshBtn").addEventListener("click", () => {
    location.reload();
  });
})();
</script>

</body>
</html>

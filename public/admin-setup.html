
<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help Zone | Admin Setup</title>
</head>
<body>
  <main>
    <h2>প্রথম অ্যাডমিন পাসওয়ার্ড তৈরি</h2>

    <form id="setupForm">
      <label>One-time setup key</label>
      <input name="setupKey" required>

      <label>নতুন পাসওয়ার্ড (কমপক্ষে ১২ অক্ষর)</label>
      <input type="password" name="password"
        minlength="12" required>

      <button type="submit">
        অ্যাডমিন পাসওয়ার্ড তৈরি করুন
      </button>

      <p id="setupNotice"></p>
    </form>
  </main>

  <script src="/setup.js"></script>
</body>
</html>
